<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d5c" />
    <meta
      name="description"
      content="Street-level flood risk, live depth reports and flood-avoiding routes for Accra. A community information tool."
    />
    <title>Accra Flood Watch</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <div class="masthead__title">
          <h1>Accra Flood Watch</h1>
          <!-- Filled from the coverage the API actually reports. Hard-coding
               the area names here left the masthead advertising the original
               three-neighbourhood pilot for as long as it took somebody to
               notice, while every message in the app named the catchment. -->
          <p id="tagline" class="tagline">Accra</p>
        </div>
        <!-- Status is the first thing announced, because "what am I looking
             at and how old is it" precedes everything else on this screen. -->
        <p id="status" class="status status--pending" role="status" aria-live="polite">
          Loading flood risk…
        </p>
      </header>

      <main class="stage">
        <!-- Floats over the map rather than taking a band of its own. The
             layout fits a 390x844 phone with about 17px spare in the worst
             case, and a search bar in the document flow would spend all of
             it. -->
        <form id="search" class="search" role="search" autocomplete="off">
          <label class="search__label" for="search-input">Search for a place</label>
          <div class="search__field">
            <span class="search__icon" aria-hidden="true">⌕</span>
            <input
              id="search-input"
              class="search__input"
              type="search"
              name="q"
              enterkeyhint="search"
              placeholder="Street or landmark…"
              aria-describedby="search-results"
            />
            <button type="button" class="search__clear" aria-label="Clear search" hidden>
              ✕
            </button>
          </div>
          <div id="search-results" class="search__results" role="region" aria-live="polite" hidden></div>
        </form>

        <!-- Floats over the map, for the same reason the search does: the
             layout has no vertical budget left, and a language control is a
             rare one-time action that does not deserve a band of its own. -->
        <div class="language">
          <label class="search__label" for="language-select">Language</label>
          <select id="language-select" class="language__select"></select>
        </div>

        <div id="map" class="map" role="application" aria-label="Flood risk map of the pilot area">
          <noscript>
            <p class="noscript">
              Accra Flood Watch needs JavaScript to draw the flood risk map. For official
              warnings, contact NADMO or the Ghana Meteorological Agency.
            </p>
          </noscript>
        </div>

        <!-- What the map is answering, and the choice to ask the other
             question. The sentence comes first: a toggle whose two states are
             not explained is a toggle people leave alone. -->
        <div class="view-bar">
          <p id="view-reason" class="view-bar__reason" role="status" aria-live="polite"></p>
          <div class="view-toggle" role="group" aria-label="What the map shows">
            <button
              type="button"
              class="view-toggle__option"
              data-view="now"
              aria-pressed="true"
            >
              Right now
            </button>
            <button
              type="button"
              class="view-toggle__option"
              data-view="later"
              aria-pressed="false"
            >
              Later today
            </button>
            <button
              type="button"
              class="view-toggle__option"
              data-view="terrain"
              aria-pressed="false"
            >
              When it rains
            </button>
          </div>
        </div>

        <section id="legend" class="legend" aria-label="What the colours and patterns mean"></section>

        <!-- Shown only while a destination is being chosen. It replaces the
             instruction that would otherwise have to live in a sheet covering
             the map the user is trying to tap. -->
        <div id="route-prompt" class="route-prompt" role="status" aria-live="polite" hidden>
          <p class="route-prompt__text">Tap where you are going.</p>
          <button type="button" id="route-cancel" class="route-prompt__cancel">Cancel</button>
        </div>

        <!-- Fixed, thumb-reachable, and the largest target on the screen.
             It is pressed one-handed, in the rain, under time pressure. -->
        <div class="actions">
          <button id="route-button" type="button" class="route-button">
            <span class="route-button__icon" aria-hidden="true">➔</span>
            <span>Safe route</span>
          </button>
          <button id="report-button" type="button" class="report-button">
            <span class="report-button__icon" aria-hidden="true">＋</span>
            <span class="report-button__label">Report water</span>
          </button>
        </div>
      </main>

      <footer class="disclaimer">
        <p>
          <strong>This is a community information tool, not an official warning service.</strong>
          For official warnings consult
          <abbr title="National Disaster Management Organisation">NADMO</abbr> and the Ghana
          Meteorological Agency.
        </p>
      </footer>
    </div>

    <div id="detail-sheet" class="sheet" role="dialog" aria-modal="false" aria-label="Flood risk detail" hidden>
      <div class="sheet__panel">
        <button type="button" class="sheet__close" aria-label="Close">Close</button>
        <div class="sheet__body"></div>
      </div>
    </div>

    <div id="route-sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Safe route" hidden>
      <div class="sheet__panel">
        <button type="button" class="sheet__close" aria-label="Close">Close</button>
        <div class="sheet__body"></div>
      </div>
    </div>

    <div id="report-sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Report water depth" hidden>
      <div class="sheet__panel">
        <button type="button" class="sheet__close" aria-label="Close">Close</button>
        <div class="sheet__body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
