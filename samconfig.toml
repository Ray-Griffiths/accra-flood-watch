version = 0.1

# Written directly rather than generated by `sam deploy --guided`, so that
# every deploy is non-interactive and reproducible from an empty account.

[default.global.parameters]
stack_name = "accra-flood-watch"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
resolve_s3 = true
parameter_overrides = "Environment=prod"

[default.sync.parameters]
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
watch = false

[default.logs.parameters]
region = "eu-west-1"
