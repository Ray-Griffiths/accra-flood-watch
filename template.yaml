AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Accra Flood Watch - neighbourhood flood risk, reporting and safe routing for Accra.
  Skeleton stack: static PWA on S3 behind CloudFront, HTTP API, health handler.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment environment. Staging and production differ only by parameter.

  VapidSubject:
    Type: String
    Default: mailto:accrafloodwatch@gctu.edu.gh
    Description: >
      Contact address push services use to reach the operator about a
      misbehaving sender. Required by the Web Push spec; must be a mailto: or
      https: URL.
    AllowedPattern: "^(mailto:|https://).+"

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 5
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ----------------------------------------------------------------------------
  # Static site origin. Block all public access; CloudFront reads via OAC only.
  # ----------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        # A bad deployment is rolled back in seconds rather than rebuilt.
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ----------------------------------------------------------------------------
  # Map tiles. The browser holds a key scoped to GeoMaps only -- never Places
  # or Routes, which cost materially more per request and are called solely
  # from Lambda with IAM credentials. Anyone can read this key out of the page
  # source, so what it can do is what limits the damage.
  #
  # AllowActions must be `geo-maps:*` rather than an explicit list including
  # GetStyleDescriptor: that is a real GeoMaps API operation but NOT a valid
  # API-key action, and naming it makes CreateKey fail with an AccessDenied
  # whose action name is empty. Through CloudFormation the same failure
  # surfaces only as "Access denied for operation 'AWS::Location::APIKey'".
  # Verified by probing CreateKey directly with each action in turn.
  # ----------------------------------------------------------------------------
  MapApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub "${AWS::StackName}-maps"
      Description: Browser map tile rendering. GeoMaps only.
      NoExpiry: true
      Restrictions:
        AllowActions:
          - geo-maps:*
        AllowResources:
          - !Sub "arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default"

  # Base map tiles for a fixed city do not change from one hour to the next, so
  # they are cached at the edge for a month. Section 16 of the project plan
  # identifies tile requests as the dominant cost once usage grows: at 10,000
  # users this line item is ~$160/month uncached and a small fraction of that
  # behind this policy. Designed in from the start rather than discovered after
  # the first large bill.
  TileCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-tiles"
        Comment: Long-lived caching for Amazon Location map tiles.
        DefaultTTL: 2592000 # 30 days
        MaxTTL: 31536000
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            # The key and style variant must reach the origin and must form
            # part of the cache key, or every variant would collide.
            QueryStringBehavior: whitelist
            QueryStrings:
              - key
              - color-scheme
              - variant
              - political-view

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----------------------------------------------------------------------------
  # The public face of the project. This URL is what the ship gate is judged on.
  # ----------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Accra Flood Watch (${Environment})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass 100 covers Europe, which is what serves Accra.
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: http-api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: geo-maps
            DomainName: !Sub "maps.geo.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          # Serving the API under the same origin means the browser makes
          # same-origin calls and no CORS preflight is ever needed.
          - PathPattern: /api/*
            TargetOriginId: http-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          # Amazon Location serves tiles and style descriptors under /v2/*.
          # Matching that prefix means CloudFront forwards the path unchanged,
          # with no rewriting function needed.
          - PathPattern: /v2/*
            TargetOriginId: geo-maps
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref TileCachePolicy
        CustomErrorResponses:
          # Makes client-side routing work against a static origin.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          # Default CloudFront domain arrives with a valid certificate.
          CloudFrontDefaultCertificate: true

  # ----------------------------------------------------------------------------
  # Persistence.
  #
  # The grid is geohash-7 (~152m). Tables that answer "what is in this map
  # viewport" are partitioned by the geohash-6 PREFIX (~1.2km x 0.6km) and
  # sorted by the full cell, so a viewport resolves to a handful of prefixes
  # and each one is a single Query returning at most 32 cells. Partitioning by
  # the full cell instead would force a BatchGetItem over every key in view.
  # No scan, ever.
  #
  # Table names are deliberately auto-generated. An explicit name makes any
  # key-schema change fail, because CloudFormation must create the replacement
  # before deleting the original and the two would collide on the name.
  # ----------------------------------------------------------------------------
  RiskCellsTable:
    Type: AWS::DynamoDB::Table
    # Regenerable: re-run the preprocessing pipeline and re-seed.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # Encrypted at rest either way. `false` selects the AWS-owned key,
        # which costs nothing; `true` would switch to an AWS-managed KMS key
        # and add charges for no benefit here, since this table holds only
        # derived terrain data and there is no compliance requirement for a
        # customer-managed key.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cellPrefix
          AttributeType: S
        - AttributeName: cell
          AttributeType: S
      KeySchema:
        - AttributeName: cellPrefix
          KeyType: HASH
        - AttributeName: cell
          KeyType: RANGE

  ReportsTable:
    Type: AWS::DynamoDB::Table
    # Community reports cannot be regenerated. A stack delete or a replacing
    # update must never take them with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # See RiskCellsTable. Reports carry no personal data by design: a
        # report is coordinates, a severity and a timestamp, with nothing
        # linking two reports from the same device.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cellPrefix
          AttributeType: S
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: cellPrefix
          KeyType: HASH
        # reportId is prefixed with the submission timestamp, so the sort key
        # orders reports by age within an area for free.
        - AttributeName: reportId
          KeyType: RANGE
      TimeToLiveSpecification:
        # Reports delete themselves 24h after submission, at no cost, with no
        # cleanup job. This is the technical guarantee behind the privacy
        # promise, and it keeps the map honest: yesterday's report is not
        # evidence about today.
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        # Accumulated community reports are the one genuinely irreplaceable
        # asset this project has.
        PointInTimeRecoveryEnabled: true

  WatchersTable:
    Type: AWS::DynamoDB::Table
    # Push subscriptions are re-established by the browser on next visit.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # See RiskCellsTable. Holds an opaque browser push endpoint and a
        # label, never a person.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cell
          AttributeType: S
        - AttributeName: subscriptionId
          AttributeType: S
      KeySchema:
        # Keyed by the exact watched cell rather than by user, so that when a
        # cell turns red the scoring function finds everyone who needs telling
        # in one query. Keying by user would force a scan at exactly the wrong
        # moment.
        - AttributeName: cell
          KeyType: HASH
        - AttributeName: subscriptionId
          KeyType: RANGE
      TimeToLiveSpecification:
        # A subscription nobody has refreshed in ninety days is a browser that
        # is not coming back. It deletes itself rather than being pushed to
        # forever, which keeps both the bill and the retained data bounded.
        # Every visit re-registers, so an active user never lapses.
        AttributeName: expiresAt
        Enabled: true

  # ----------------------------------------------------------------------------
  # HTTP front door. Routes carry the /api prefix so CloudFront forwards
  # them through unchanged - CloudFront cannot rewrite paths without a function.
  # ----------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Same-origin through CloudFront means CORS is not required. It is set
      # anyway so `sam local` and the Vite dev server can reach the API.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 300
      # Admission control. Without it the only thing capping an abusive burst
      # is the account's Lambda concurrency, which is a limit that protects AWS
      # rather than this project: reaching it starves the read path, and the
      # bill for getting there arrives hours later through a budget alert.
      #
      # These are STAGE limits, not per-caller limits -- API Gateway does not
      # do per-IP throttling, and WAF, which does, is out of scope. So this
      # bounds total spend; it does not isolate one bad client from the rest.
      # That is the right trade here, because uncontrolled cost is the risk
      # that ends the project and a brief denial is the risk that annoys.
      DefaultRouteSettings:
        ThrottlingRateLimit: 40
        ThrottlingBurstLimit: 80
      RouteSettings:
        # The unauthenticated write path. A person reporting water taps once;
        # a burst of 20 covers several people at the same junction in the same
        # few seconds, and 5/s sustained is 18,000 reports an hour -- orders of
        # magnitude past anything the pilot area could legitimately produce.
        "POST /api/reports":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        # Every call here is a GeoRoutes call, which costs materially more per
        # request than anything else in the system. One deliberate tap each.
        "POST /api/route":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        # One tap to save a place, and the browser re-registers on each visit.
        "POST /api/watch":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # Request bodies are deliberately excluded so that reported
        # coordinates are never duplicated into logs.
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}"
      # Retention is set explicitly everywhere. The default never expires.
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Health: liveness and last scoring run time. Monitored through judging.
  # ----------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/health.handler
      Description: Liveness probe and last scoring run time.
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        # One GetItem against the "#meta" partition. Read-only, like every
        # other handler that is not the write path.
        - DynamoDBReadPolicy:
            TableName: !Ref RiskCellsTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/health
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/health.ts

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${HealthFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Read path. Neither function has any write permission at all.
  # ----------------------------------------------------------------------------
  GetRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getRisk.handler
      Description: Risk cells for a map viewport.
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiskCellsTable
      Events:
        GetRisk:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/risk
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getRisk.ts

  GetRiskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetRiskFunction}"
      RetentionInDays: 7

  GetReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getReports.handler
      Description: Active community reports for a map viewport.
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
      Events:
        GetReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/reports
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getReports.ts

  GetReportsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetReportsFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Write path. Unauthenticated by design, so it is the abuse surface: it gets
  # reserved concurrency of its own so a flood of submissions during a storm
  # cannot exhaust account concurrency and starve the read path.
  #
  # It can write Reports and read RiskCells. It deliberately cannot read
  # Watchers -- notification dispatch belongs to the scoring function.
  # ----------------------------------------------------------------------------
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/submitReport.handler
      Description: Accept a one-tap water depth report.
      # NOTE: the project plan calls for reserved concurrency on the write path
      # so a storm-time flood of submissions cannot exhaust account concurrency
      # and starve the read path. It is commented out because this account is
      # still on the new-account default of 10 total concurrent executions, and
      # any reservation drops unreserved below the required minimum of 10.
      #
      # Restore this once the Lambda concurrency quota (L-B99A9384) is raised.
      # Until then the read and write paths share a very small pool, which is
      # the single biggest resilience gap in the deployment.
      # ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RiskCellsTable
      Events:
        SubmitReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/reports
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/submitReport.ts

  SubmitReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SubmitReportFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Watch a place. Registers the browser's push subscription against the grid
  # cell, so that when the scoring job raises that cell it finds everyone who
  # needs telling in one query.
  #
  # Writes Watchers and nothing else. It cannot read them back: enumerating
  # who is watching where is not something the public write path should be
  # able to do, and dispatch belongs to the scoring function.
  # ----------------------------------------------------------------------------
  SaveWatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/saveWatch.handler
      Description: Register or cancel a push subscription for a watched cell.
      Environment:
        Variables:
          WATCHERS_TABLE: !Ref WatchersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt WatchersTable.Arn
      Events:
        SaveWatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/watch
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/saveWatch.ts

  SaveWatchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SaveWatchFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Safe routing. Reads the grid and the standing reports, turns them into
  # GeoRoutes avoidance areas, and checks the returned geometry against the
  # blocked cells itself -- Avoid.Areas is documented as best effort, and
  # "never route through a confirmed cell" is not.
  #
  # Read-only on both tables. This function cannot write anything.
  # ----------------------------------------------------------------------------
  CalculateSafeRouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/calculateSafeRoute.handler
      Description: Walking or driving route that avoids reported flooding.
      # Two DynamoDB query fans plus up to two GeoRoutes calls (the second is
      # the direct route, calculated only so the answer can state the detour).
      Timeout: 15
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
          REPORTS_TABLE: !Ref ReportsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RiskCellsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
        - Statement:
            # Scoped to the provider resource rather than "*". GeoRoutes costs
            # materially more per request than tiles, which is exactly why it
            # is reached with IAM from here and never with a key in the browser.
            - Effect: Allow
              Action: geo-routes:CalculateRoutes
              Resource: !Sub "arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default"
      Events:
        CalculateRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/route
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/calculateSafeRoute.ts

  CalculateSafeRouteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CalculateSafeRouteFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Client configuration. The map key is served rather than baked into the
  # bundle, so rotating it does not require rebuilding and redeploying the PWA.
  # ----------------------------------------------------------------------------
  GetConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getConfig.handler
      Description: Client runtime configuration, including the map tile key.
      Environment:
        Variables:
          # CloudFormation does not expose the key value as an attribute, so
          # the handler resolves it at runtime via DescribeKey and caches it
          # for the life of the execution environment.
          MAP_API_KEY_NAME: !Sub "${AWS::StackName}-maps"
          MAP_STYLE: Standard
          # The public half of the VAPID pair. Public by definition -- the
          # browser needs it to subscribe. This function is deliberately not
          # granted the private half or any KMS decrypt.
          VAPID_PUBLIC_PARAMETER: !Sub "/${AWS::StackName}/vapid/public"
      Policies:
        - Statement:
            - Effect: Allow
              Action: geo:DescribeKey
              Resource: !GetAtt MapApiKey.KeyArn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/vapid/public"
      Events:
        GetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/config
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getConfig.ts

  GetConfigFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetConfigFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Hourly scoring. This is what makes the system live rather than a static
  # terrain map: it combines terrain with the rainfall forecast and the reports
  # standing in each cell, and writes back a score, a level and the sentence
  # that justifies them. Nothing is scored on the request path.
  # ----------------------------------------------------------------------------
  ScoringTuning:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/scoring"
      Type: String
      Description: Risk thresholds and component weights. Tunable without a redeploy.
      # Editing this in the console takes effect on the next scoring run, which
      # is the point: thresholds can be tuned during a live demo. CloudFormation
      # owns the value, so a console edit is reverted by the next deploy -- an
      # accepted trade for being able to change it in seconds.
      Value: '{"thresholds":{"watch":45,"high":70},"weights":{"susceptibility":0.4,"rainfall":0.4,"reports":0.2}}'

  ScoreRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/scoreRisk.handler
      Description: Hourly risk recomputation across the whole pilot grid.
      # Roughly 40 queries, an external forecast call and ~1,140 writes. It
      # finishes in seconds, but the forecast feed is a third party and the
      # timeout has to cover a slow one rather than truncating the run.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
          REPORTS_TABLE: !Ref ReportsTable
          WATCHERS_TABLE: !Ref WatchersTable
          TUNING_PARAMETER: !Ref ScoringTuning
          # SecureString parameters cannot be created by CloudFormation, so
          # these are provisioned out of band and referenced by name. A stack
          # without them scores normally and sends nothing -- see the handler.
          VAPID_PUBLIC_PARAMETER: !Sub "/${AWS::StackName}/vapid/public"
          VAPID_PRIVATE_PARAMETER: !Sub "/${AWS::StackName}/vapid/private"
          VAPID_SUBJECT: !Ref VapidSubject
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RiskCellsTable
        # Reports are read to score them and never written by this function.
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
        - Statement:
            # Dispatch reads the watchers of a raised cell and deletes the
            # subscriptions the push service reports as retired. It cannot
            # create one: registration is saveWatch's job alone.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt WatchersTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/scoring"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/vapid/*"
            - Effect: Allow
              # Needed to read the SecureString half of the VAPID pair. Scoped
              # by ViaService so this grant cannot be used to decrypt anything
              # that did not come through Parameter Store.
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            # Top of every hour, per section 7.5 of the plan.
            ScheduleExpression: cron(0 * * * ? *)
            ScheduleExpressionTimezone: UTC
            Description: Hourly Accra Flood Watch risk recomputation.
            RetryPolicy:
              # One hour until the next run; two quick retries cover a blip in
              # the forecast feed without stacking invocations.
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/scoreRisk.ts

  ScoreRiskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScoreRiskFunction}"
      RetentionInDays: 7

  # An hourly job that stops running is invisible until somebody notices the
  # map is stale. This makes it noisy instead: the metric is emitted on every
  # successful run, so "no data" for three hours is itself the alarm.
  ScoringStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-scoring-stalled"
      AlarmDescription: Risk scoring has not completed successfully in three hours.
      Namespace: AccraFloodWatch
      MetricName: CellsScored
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # The forecast feed failing is not an outage -- the map degrades to terrain
  # and reports and says so. It is still worth knowing about.
  ForecastFeedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-forecast-feed-down"
      AlarmDescription: The rainfall forecast feed has been unavailable for three hours.
      Namespace: AccraFloodWatch
      MetricName: ForecastAvailable
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

Outputs:
  SiteUrl:
    Description: Public HTTPS URL. This is the ship gate.
    Value: !Sub "https://${Distribution.DomainName}"
  HealthUrl:
    Description: Health endpoint, for uptime checks during judging.
    Value: !Sub "https://${Distribution.DomainName}/api/health"
  WebBucketName:
    Description: S3 bucket holding the built PWA.
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront distribution id, used for cache invalidation.
    Value: !Ref Distribution
  ApiEndpoint:
    Description: Direct API Gateway endpoint, bypassing CloudFront.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  RiskCellsTableName:
    Description: Risk cell grid, seeded from the terrain preprocessing artefact.
    Value: !Ref RiskCellsTable
  ReportsTableName:
    Description: Community depth reports, self-expiring after 24 hours.
    Value: !Ref ReportsTable
  WatchersTableName:
    Description: Web push subscriptions, keyed by watched cell.
    Value: !Ref WatchersTable
