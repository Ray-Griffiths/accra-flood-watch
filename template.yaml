AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Accra Flood Watch - neighbourhood flood risk, reporting and safe routing for Accra.
  Skeleton stack: static PWA on S3 behind CloudFront, HTTP API, health handler.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment environment. Staging and production differ only by parameter.

  VapidSubject:
    Type: String
    Default: mailto:accrafloodwatch@gctu.edu.gh
    Description: >
      Contact address push services use to reach the operator about a
      misbehaving sender. Required by the Web Push spec; must be a mailto: or
      https: URL.
    AllowedPattern: "^(mailto:|https://).+"

  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Address that receives operational alarms — scoring stalled, forecast feed
      down. Deliberately has no default: this repository is public, and baking
      an address into it publishes it. Pass it at deploy time and it lives in
      the stack parameters instead. Left empty, the alarms still evaluate and
      simply have nowhere to send, which is the pre-existing behaviour.
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 5
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        NODE_OPTIONS: --enable-source-maps

Resources:
  # ----------------------------------------------------------------------------
  # Static site origin. Block all public access; CloudFront reads via OAC only.
  # ----------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        # A bad deployment is rolled back in seconds rather than rebuilt.
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ----------------------------------------------------------------------------
  # Map tiles. The browser holds a key scoped to GeoMaps only -- never Places
  # or Routes, which cost materially more per request and are called solely
  # from Lambda with IAM credentials. Anyone can read this key out of the page
  # source, so what it can do is what limits the damage.
  #
  # AllowActions must be `geo-maps:*` rather than an explicit list including
  # GetStyleDescriptor: that is a real GeoMaps API operation but NOT a valid
  # API-key action, and naming it makes CreateKey fail with an AccessDenied
  # whose action name is empty. Through CloudFormation the same failure
  # surfaces only as "Access denied for operation 'AWS::Location::APIKey'".
  # Verified by probing CreateKey directly with each action in turn.
  # ----------------------------------------------------------------------------
  MapApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub "${AWS::StackName}-maps"
      Description: Browser map tile rendering. GeoMaps only.
      NoExpiry: true
      Restrictions:
        AllowActions:
          - geo-maps:*
        AllowResources:
          - !Sub "arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default"

  # Base map tiles for a fixed city do not change from one hour to the next, so
  # they are cached at the edge for a month. Section 16 of the project plan
  # identifies tile requests as the dominant cost once usage grows: at 10,000
  # users this line item is ~$160/month uncached and a small fraction of that
  # behind this policy. Designed in from the start rather than discovered after
  # the first large bill.
  TileCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-tiles"
        Comment: Long-lived caching for Amazon Location map tiles.
        DefaultTTL: 2592000 # 30 days
        MaxTTL: 31536000
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            # The key and style variant must reach the origin and must form
            # part of the cache key, or every variant would collide.
            QueryStringBehavior: whitelist
            QueryStrings:
              - key
              - color-scheme
              - variant
              - political-view

  # The risk overlay is the dominant read, and the one that spikes hardest:
  # rain over Accra means every phone with the app open is asking for the same
  # handful of viewports at once. `getRisk` sets `cache-control: max-age=60`
  # for exactly that reason, but the managed CachingDisabled policy on /api/*
  # forces TTL 0 and ignores it, so the protection the handler believes it has
  # did not exist. This policy honours the origin's own header.
  #
  # Sixty seconds is bounded by what the data can change in: scoring runs
  # hourly, and the fast path that can move a cell sooner -- a report crossing
  # into confirmed -- reaches the user through the push alert and /api/reports,
  # neither of which is cached.
  RiskCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-risk"
        Comment: Brief edge caching for the risk overlay, keyed on the viewport.
        DefaultTTL: 60
        MaxTTL: 300
        # Zero, so the handler stays in charge: a response it marks no-store
        # is not cached, which is what keeps an error page from sticking.
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            # The viewport IS the cache key. Anything else forwarded would
            # fragment the cache without changing the answer.
            QueryStringBehavior: whitelist
            QueryStrings:
              - bbox

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----------------------------------------------------------------------------
  # The public face of the project. This URL is what the ship gate is judged on.
  # ----------------------------------------------------------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Accra Flood Watch (${Environment})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # PriceClass 200 is what puts this map on an African edge.
        #
        # PriceClass_100 stops at the USA, Canada, Europe and Israel -- it has
        # NO African edge locations, so every tile for a user in Accra was
        # served from Europe, about 5,000km away. PriceClass_200 adds Lagos,
        # roughly 400km down the coast, along with Nairobi, Johannesburg and
        # Cape Town.
        #
        # African data transfer is dearer per GB (~$0.11 against ~$0.085 in
        # Europe), which at pilot volume is cents a month. The users this is
        # built for are on mid-range Android phones on Ghanaian mobile data,
        # and first paint is the thing they experience. That trade is worth
        # making in their favour.
        PriceClass: PriceClass_200
        Origins:
          - Id: s3-web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: http-api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: geo-maps
            DomainName: !Sub "maps.geo.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          # Ordered: CloudFront takes the first pattern that matches, so this
          # must stay above /api/* or it will never be reached.
          #
          # The one API response worth caching at the edge. GET only -- the
          # risk overlay is a read, and listing the write methods here would
          # be inviting a future endpoint to be cached by accident.
          - PathPattern: /api/risk
            TargetOriginId: http-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref RiskCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          # Serving the API under the same origin means the browser makes
          # same-origin calls and no CORS preflight is ever needed.
          - PathPattern: /api/*
            TargetOriginId: http-api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          # Amazon Location serves tiles and style descriptors under /v2/*.
          # Matching that prefix means CloudFront forwards the path unchanged,
          # with no rewriting function needed.
          - PathPattern: /v2/*
            TargetOriginId: geo-maps
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref TileCachePolicy
        # Custom error responses are distribution-wide: CloudFront applies them
        # to whichever origin produced the status, so every entry here is also
        # an entry for the API.
        #
        # 404 used to be mapped and should not have been. S3 behind Origin
        # Access Control answers a missing object with 403, not 404, so the
        # static origin never needed it -- while API Gateway returns 404 for
        # any unmatched route. The mapping turned that into index.html with a
        # 200, so the client parsed HTML as JSON and reported a broken
        # connection instead of a missing endpoint.
        CustomErrorResponses:
          # Serves the shell for a path S3 has no object for.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          # Default CloudFront domain arrives with a valid certificate.
          CloudFrontDefaultCertificate: true

  # ----------------------------------------------------------------------------
  # Persistence.
  #
  # The grid is geohash-7 (~152m). Tables that answer "what is in this map
  # viewport" are partitioned by the geohash-6 PREFIX (~1.2km x 0.6km) and
  # sorted by the full cell, so a viewport resolves to a handful of prefixes
  # and each one is a single Query returning at most 32 cells. Partitioning by
  # the full cell instead would force a BatchGetItem over every key in view.
  # No scan, ever.
  #
  # Table names are deliberately auto-generated. An explicit name makes any
  # key-schema change fail, because CloudFormation must create the replacement
  # before deleting the original and the two would collide on the name.
  # ----------------------------------------------------------------------------
  RiskCellsTable:
    Type: AWS::DynamoDB::Table
    # Regenerable: re-run the preprocessing pipeline and re-seed.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # Encrypted at rest either way. `false` selects the AWS-owned key,
        # which costs nothing; `true` would switch to an AWS-managed KMS key
        # and add charges for no benefit here, since this table holds only
        # derived terrain data and there is no compliance requirement for a
        # customer-managed key.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cellPrefix
          AttributeType: S
        - AttributeName: cell
          AttributeType: S
      KeySchema:
        - AttributeName: cellPrefix
          KeyType: HASH
        - AttributeName: cell
          KeyType: RANGE

  ReportsTable:
    Type: AWS::DynamoDB::Table
    # Community reports cannot be regenerated. A stack delete or a replacing
    # update must never take them with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # See RiskCellsTable. Reports carry no personal data by design: a
        # report is coordinates, a severity and a timestamp, with nothing
        # linking two reports from the same device.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cellPrefix
          AttributeType: S
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: cellPrefix
          KeyType: HASH
        # reportId is prefixed with the submission timestamp, so the sort key
        # orders reports by age within an area for free.
        - AttributeName: reportId
          KeyType: RANGE
      TimeToLiveSpecification:
        # Reports delete themselves 24h after submission, at no cost, with no
        # cleanup job. This is the technical guarantee behind the privacy
        # promise, and it keeps the map honest: yesterday's report is not
        # evidence about today.
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        # Accumulated community reports are the one genuinely irreplaceable
        # asset this project has.
        PointInTimeRecoveryEnabled: true

  WatchersTable:
    Type: AWS::DynamoDB::Table
    # Push subscriptions are re-established by the browser on next visit.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        # See RiskCellsTable. Holds an opaque browser push endpoint and a
        # label, never a person.
        SSEEnabled: false
      AttributeDefinitions:
        - AttributeName: cell
          AttributeType: S
        - AttributeName: subscriptionId
          AttributeType: S
      KeySchema:
        # Keyed by the exact watched cell rather than by user, so that when a
        # cell turns red the scoring function finds everyone who needs telling
        # in one query. Keying by user would force a scan at exactly the wrong
        # moment.
        - AttributeName: cell
          KeyType: HASH
        - AttributeName: subscriptionId
          KeyType: RANGE
      TimeToLiveSpecification:
        # A subscription nobody has refreshed in ninety days is a browser that
        # is not coming back. It deletes itself rather than being pushed to
        # forever, which keeps both the bill and the retained data bounded.
        # Every visit re-registers, so an active user never lapses.
        AttributeName: expiresAt
        Enabled: true

  # ----------------------------------------------------------------------------
  # HTTP front door. Routes carry the /api prefix so CloudFront forwards
  # them through unchanged - CloudFront cannot rewrite paths without a function.
  # ----------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Same-origin through CloudFront means CORS is not required. It is set
      # anyway so `sam local` and the Vite dev server can reach the API.
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 300
      # Admission control. Without it the only thing capping an abusive burst
      # is the account's Lambda concurrency, which is a limit that protects AWS
      # rather than this project: reaching it starves the read path, and the
      # bill for getting there arrives hours later through a budget alert.
      #
      # These are STAGE limits, not per-caller limits -- API Gateway does not
      # do per-IP throttling, and WAF, which does, is out of scope. So this
      # bounds total spend; it does not isolate one bad client from the rest.
      # That is the right trade here, because uncontrolled cost is the risk
      # that ends the project and a brief denial is the risk that annoys.
      DefaultRouteSettings:
        ThrottlingRateLimit: 40
        ThrottlingBurstLimit: 80
      RouteSettings:
        # The unauthenticated write path. A person reporting water taps once;
        # a burst of 20 covers several people at the same junction in the same
        # few seconds, and 5/s sustained is 18,000 reports an hour -- orders of
        # magnitude past anything the pilot area could legitimately produce.
        "POST /api/reports":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 20
        # Every call here is a GeoRoutes call, which costs materially more per
        # request than anything else in the system. One deliberate tap each.
        "POST /api/route":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        # One tap to save a place, and the browser re-registers on each visit.
        "POST /api/watch":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
        # Every call here is a billed GeoPlaces request. The client searches on
        # submit rather than per keystroke, so a real user generates one call
        # per search; this is the ceiling that keeps a script from turning the
        # only pay-per-call read into a bill.
        "GET /api/search":
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # Request bodies are deliberately excluded so that reported
        # coordinates are never duplicated into logs.
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}"
      # Retention is set explicitly everywhere. The default never expires.
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Health: liveness and last scoring run time. Monitored through judging.
  # ----------------------------------------------------------------------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/health.handler
      Description: Liveness probe and last scoring run time.
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        # One GetItem against the "#meta" partition, and nothing else.
        #
        # DynamoDBReadPolicy would also grant Query, Scan and BatchGetItem.
        # Scan in particular is a capability this project has designed itself
        # out of needing -- every access pattern resolves to a key -- so
        # holding it anywhere contradicts the table design.
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt RiskCellsTable.Arn
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/health
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/health.ts

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${HealthFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Read path. Neither function has any write permission at all.
  # ----------------------------------------------------------------------------
  GetRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getRisk.handler
      Description: Risk cells for a map viewport.
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        # Query by cellPrefix. Never Scan -- see the table comment.
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt RiskCellsTable.Arn
      Events:
        GetRisk:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/risk
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getRisk.ts

  GetRiskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetRiskFunction}"
      RetentionInDays: 7

  GetReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getReports.handler
      Description: Active community reports for a map viewport.
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ReportsTable.Arn
      Events:
        GetReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/reports
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getReports.ts

  GetReportsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetReportsFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Place search. Answers "is Kaneshie Market flooded" without making somebody
  # pan a map one-handed in the rain to find a junction they can already name.
  #
  # GeoPlaces is billed per request and is reached with IAM from here, never
  # from the browser -- the browser holds only the referer-restricted tile key.
  # The route is throttled harder than the other reads for the same reason: it
  # is the only read that costs money per call.
  # ----------------------------------------------------------------------------
  SearchPlacesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/searchPlaces.handler
      Description: Find a place by name and report the flood risk at it.
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
      Policies:
        - Statement:
            # Read-only: search resolves a name to a cell and reads that cell.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt RiskCellsTable.Arn
            - Effect: Allow
              Action: geo-places:SearchText
              Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
      Events:
        SearchPlaces:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/search
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/searchPlaces.ts

  SearchPlacesFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SearchPlacesFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Write path. Unauthenticated by design, so it is the abuse surface: it gets
  # reserved concurrency of its own so a flood of submissions during a storm
  # cannot exhaust account concurrency and starve the read path.
  #
  # It can write Reports and read RiskCells. It deliberately cannot read
  # Watchers -- notification dispatch belongs to the scoring function.
  # ----------------------------------------------------------------------------
  SubmitReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/submitReport.handler
      Description: Accept a one-tap water depth report.
      # NOTE: the project plan calls for reserved concurrency on the write path
      # so a storm-time flood of submissions cannot exhaust account concurrency
      # and starve the read path. It is commented out because this account is
      # still on the new-account default of 10 total concurrent executions, and
      # any reservation drops unreserved below the required minimum of 10.
      #
      # Restore this once the Lambda concurrency quota (L-B99A9384) is raised.
      # Until then the read and write paths share a very small pool, which is
      # the single biggest resilience gap in the deployment.
      # ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
          # Which function to ask for an alert when a report confirms a cell.
          # The name, not the table: this handler still cannot touch Watchers.
          NOTIFY_FUNCTION_NAME: !Ref NotifyCellFunction
      Policies:
        # PutItem to record the report, Query to count the recent ones in the
        # same cell. That is the entire data path.
        #
        # This replaced DynamoDBCrudPolicy, which additionally granted
        # DeleteItem, UpdateItem, BatchWriteItem and Scan. On the public,
        # unauthenticated write path those are not conveniences, they are the
        # difference between "a bug can write a bad report" and "a bug can
        # delete the reports table's contents". Reports are the one asset here
        # that cannot be regenerated.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt ReportsTable.Arn
        # The RiskCells read grant that used to sit here was dead: this handler
        # has never read that table. Removed rather than left "in case".
        - Statement:
            # One ARN, one action. This is the whole of this function's ability
            # to cause an alert to be sent -- it cannot read who will receive
            # one, or reach the signing keys used to send it.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt NotifyCellFunction.Arn
      Events:
        SubmitReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/reports
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/submitReport.ts

  SubmitReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SubmitReportFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Watch a place. Registers the browser's push subscription against the grid
  # cell, so that when the scoring job raises that cell it finds everyone who
  # needs telling in one query.
  #
  # Writes Watchers and nothing else. It cannot read them back: enumerating
  # who is watching where is not something the public write path should be
  # able to do, and dispatch belongs to the scoring function.
  # ----------------------------------------------------------------------------
  SaveWatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/saveWatch.handler
      Description: Register or cancel a push subscription for a watched cell.
      Environment:
        Variables:
          WATCHERS_TABLE: !Ref WatchersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt WatchersTable.Arn
      Events:
        SaveWatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/watch
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/saveWatch.ts

  SaveWatchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SaveWatchFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Safe routing. Reads the grid and the standing reports, turns them into
  # GeoRoutes avoidance areas, and checks the returned geometry against the
  # blocked cells itself -- Avoid.Areas is documented as best effort, and
  # "never route through a confirmed cell" is not.
  #
  # Read-only on both tables. This function cannot write anything.
  # ----------------------------------------------------------------------------
  CalculateSafeRouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/calculateSafeRoute.handler
      Description: Walking or driving route that avoids reported flooding.
      # Two DynamoDB query fans plus up to two GeoRoutes calls (the second is
      # the direct route, calculated only so the answer can state the detour).
      Timeout: 15
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
          REPORTS_TABLE: !Ref ReportsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt RiskCellsTable.Arn
                - !GetAtt ReportsTable.Arn
        - Statement:
            # Scoped to the provider resource rather than "*". GeoRoutes costs
            # materially more per request than tiles, which is exactly why it
            # is reached with IAM from here and never with a key in the browser.
            - Effect: Allow
              Action: geo-routes:CalculateRoutes
              Resource: !Sub "arn:${AWS::Partition}:geo-routes:${AWS::Region}::provider/default"
      Events:
        CalculateRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /api/route
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/calculateSafeRoute.ts

  CalculateSafeRouteFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CalculateSafeRouteFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Client configuration. The map key is served rather than baked into the
  # bundle, so rotating it does not require rebuilding and redeploying the PWA.
  # ----------------------------------------------------------------------------
  GetConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/getConfig.handler
      Description: Client runtime configuration, including the map tile key.
      Environment:
        Variables:
          # CloudFormation does not expose the key value as an attribute, so
          # the handler resolves it at runtime via DescribeKey and caches it
          # for the life of the execution environment.
          MAP_API_KEY_NAME: !Sub "${AWS::StackName}-maps"
          MAP_STYLE: Standard
          # The public half of the VAPID pair. Public by definition -- the
          # browser needs it to subscribe. This function is deliberately not
          # granted the private half or any KMS decrypt.
          VAPID_PUBLIC_PARAMETER: !Sub "/${AWS::StackName}/vapid/public"
      Policies:
        - Statement:
            - Effect: Allow
              Action: geo:DescribeKey
              Resource: !GetAtt MapApiKey.KeyArn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/vapid/public"
      Events:
        GetConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /api/config
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/getConfig.ts

  GetConfigFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetConfigFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Immediate alerts for resident-confirmed flooding.
  #
  # Confirmed flooding is the strongest signal the system has, and it used to
  # be the slowest to leave the building: submitReport recorded it and nobody
  # was told until the next hourly run, up to 59 minutes later.
  #
  # It is a separate function rather than code inside submitReport so that the
  # public, unauthenticated write path never gains the ability to read the
  # Watchers table or reach the VAPID signing keys. submitReport can cause an
  # alert; only this function can see who receives one.
  #
  # No event source. It is invoked asynchronously by submitReport and by
  # nothing else, so it has no URL and no route.
  # ----------------------------------------------------------------------------
  NotifyCellFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/notifyCell.handler
      Description: Alert watchers when residents confirm flooding in a cell.
      # One conditional update, one watcher query, then a push per watcher to
      # a third-party service. The same reasoning as the scoring function: the
      # timeout must cover a slow push endpoint rather than truncate the send.
      Timeout: 30
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
          WATCHERS_TABLE: !Ref WatchersTable
          VAPID_PUBLIC_PARAMETER: !Sub "/${AWS::StackName}/vapid/public"
          VAPID_PRIVATE_PARAMETER: !Sub "/${AWS::StackName}/vapid/private"
          VAPID_SUBJECT: !Ref VapidSubject
      Policies:
        - Statement:
            # GetItem is absent deliberately: the transition is claimed with a
            # conditional UpdateItem rather than a read-then-write, so this
            # function never needs to read a cell back.
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt RiskCellsTable.Arn
            # Read the watchers of the confirmed cell, and delete the
            # subscriptions the push service reports as retired. It cannot
            # create one -- registration is saveWatch's job alone.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt WatchersTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/vapid/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifyCell.ts

  NotifyCellFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NotifyCellFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Hourly scoring. This is what makes the system live rather than a static
  # terrain map: it combines terrain with the rainfall forecast and the reports
  # standing in each cell, and writes back a score, a level and the sentence
  # that justifies them. Nothing is scored on the request path.
  # ----------------------------------------------------------------------------
  ScoringTuning:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/scoring"
      Type: String
      Description: Risk thresholds and component weights. Tunable without a redeploy.
      # Editing this in the console takes effect on the next scoring run, which
      # is the point: thresholds can be tuned during a live demo. CloudFormation
      # owns the value, so a console edit is reverted by the next deploy -- an
      # accepted trade for being able to change it in seconds.
      Value: '{"thresholds":{"watch":45,"high":70},"weights":{"susceptibility":0.4,"rainfall":0.4,"reports":0.2}}'

  ScoreRiskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/scoreRisk.handler
      Description: Hourly risk recomputation across the whole pilot grid.
      # Roughly 40 queries, an external forecast call and ~1,140 writes. It
      # finishes in seconds, but the forecast feed is a third party and the
      # timeout has to cover a slow one rather than truncating the run.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          RISK_CELLS_TABLE: !Ref RiskCellsTable
          REPORTS_TABLE: !Ref ReportsTable
          WATCHERS_TABLE: !Ref WatchersTable
          TUNING_PARAMETER: !Ref ScoringTuning
          # SecureString parameters cannot be created by CloudFormation, so
          # these are provisioned out of band and referenced by name. A stack
          # without them scores normally and sends nothing -- see the handler.
          VAPID_PUBLIC_PARAMETER: !Sub "/${AWS::StackName}/vapid/public"
          VAPID_PRIVATE_PARAMETER: !Sub "/${AWS::StackName}/vapid/private"
          VAPID_SUBJECT: !Ref VapidSubject
      Policies:
        # Query to read the grid, BatchWriteItem to write it back. Not
        # DynamoDBCrudPolicy, which would also grant DeleteItem, UpdateItem and
        # Scan: this function rewrites all 1,140 cells every hour and should
        # not be able to remove any of them.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt RiskCellsTable.Arn
        # Reports are read to score them and never written by this function.
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ReportsTable.Arn
        - Statement:
            # Dispatch reads the watchers of a raised cell and deletes the
            # subscriptions the push service reports as retired. It cannot
            # create one: registration is saveWatch's job alone.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt WatchersTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/scoring"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/vapid/*"
            - Effect: Allow
              # Needed to read the SecureString half of the VAPID pair. Scoped
              # by ViaService so this grant cannot be used to decrypt anything
              # that did not come through Parameter Store.
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            # Top of every hour, per section 7.5 of the plan.
            ScheduleExpression: cron(0 * * * ? *)
            ScheduleExpressionTimezone: UTC
            Description: Hourly Accra Flood Watch risk recomputation.
            RetryPolicy:
              # One hour until the next run; two quick retries cover a blip in
              # the forecast feed without stacking invocations.
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/handlers/scoreRisk.ts

  ScoreRiskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScoreRiskFunction}"
      RetentionInDays: 7

  # ----------------------------------------------------------------------------
  # Where alarms go.
  #
  # Both alarms below have existed since Day 4 and, until now, notified nobody:
  # they evaluated correctly, changed state correctly, and told no one. An
  # alarm with no action is a dashboard widget, and the whole point of the
  # stalled-scoring alarm is to be seen without anyone opening a dashboard.
  #
  # Email rather than SMS, for the same reason alerts to residents are web
  # push: SMS to a Ghanaian number costs more per message than this stack costs
  # per day. No KMS key on the topic -- these carry an alarm name and a state,
  # nothing sensitive, and a customer-managed key would add cost for nothing.
  # ----------------------------------------------------------------------------
  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: AFW operations

  OperationsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref OperationsTopic
      Protocol: email
      # AWS emails a confirmation link on first deploy. Until it is clicked the
      # subscription stays "PendingConfirmation" and delivers nothing.
      Endpoint: !Ref AlarmEmail

  # An hourly job that stops running is invisible until somebody notices the
  # map is stale. This makes it noisy instead: the metric is emitted on every
  # successful run, so "no data" for three hours is itself the alarm.
  ScoringStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-scoring-stalled"
      AlarmDescription: Risk scoring has not completed successfully in three hours.
      Namespace: AccraFloodWatch
      # ScoringRuns, not CellsScored. The job now skips cells whose answer has
      # not changed, so a dry day writes nothing at all -- and an alarm on the
      # write count would read a correctly idle system as a stopped one.
      MetricName: ScoringRuns
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OperationsTopic]
      # Worth knowing when it starts working again, not just when it stops.
      OKActions: [!Ref OperationsTopic]

  # The forecast feed failing is not an outage -- the map degrades to terrain
  # and reports and says so. It is still worth knowing about.
  # A push alert that fails is invisible by construction: nobody complains
  # about a warning they never knew was coming. This is the only thing that
  # makes that failure mode observable.
  AlertsFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-alerts-failing"
      AlarmDescription: Web push alerts are being rejected by the push services.
      Namespace: AccraFloodWatch
      MetricName: AlertsFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # No alerts sent is not a failure. Absence here means a quiet hour.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  # The API answering 5xx is the ship gate failing in the only way that does
  # not show up as the site being down.
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: The HTTP API is returning server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  # Function-level failures, across every handler at once. Deliberately not one
  # alarm per function: eight near-identical alarms is eight things to keep in
  # step, and the log group names in the notification say which one broke.
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: Lambda functions in this stack are throwing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]

  ForecastFeedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-forecast-feed-down"
      AlarmDescription: The rainfall forecast feed has been unavailable for three hours.
      Namespace: AccraFloodWatch
      MetricName: ForecastAvailable
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

Outputs:
  SiteUrl:
    Description: Public HTTPS URL. This is the ship gate.
    Value: !Sub "https://${Distribution.DomainName}"
  HealthUrl:
    Description: Health endpoint, for uptime checks during judging.
    Value: !Sub "https://${Distribution.DomainName}/api/health"
  WebBucketName:
    Description: S3 bucket holding the built PWA.
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront distribution id, used for cache invalidation.
    Value: !Ref Distribution
  ApiEndpoint:
    Description: Direct API Gateway endpoint, bypassing CloudFront.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  RiskCellsTableName:
    Description: Risk cell grid, seeded from the terrain preprocessing artefact.
    Value: !Ref RiskCellsTable
  ReportsTableName:
    Description: Community depth reports, self-expiring after 24 hours.
    Value: !Ref ReportsTable
  WatchersTableName:
    Description: Web push subscriptions, keyed by watched cell.
    Value: !Ref WatchersTable
